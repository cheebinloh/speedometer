<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1c1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Bike Speedometer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:Seg7;  src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2) format('woff2'); font-display:swap; }
  :root {
    --bg:#1b1c1e; --surface:#26272a; --line:#2f3134; --fg:#f2f2f0; --dim:#8b8d91; --ghost:#2b2c2f;
    --amber:#f5a524; --coral:#f2605a; --tick:#4a4c50; --tick-major:#9a9ca0; --fill-a:#c7781a; --fill-b:#ffc04d;
    --g:min(86vw, 380px, 46dvh);   /* gauge size */
  }
  /* Daylight: max contrast for direct sun — pure white/black, darker accents so they read on white */
  :root[data-theme="day"] {
    --bg:#fff; --surface:#ebebeb; --line:#d0d0d0; --fg:#000; --dim:#454545; --ghost:#ededed;
    --amber:#b85f00; --coral:#d2302a; --tick:#9a9a9a; --tick-major:#000; --fill-a:#b85f00; --fill-b:#f09a00;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font-family:Barlow, system-ui, sans-serif; min-height:100dvh; display:flex; flex-direction:column;
         padding:max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
         -webkit-user-select:none; user-select:none; overflow-x:hidden; -webkit-tap-highlight-color:transparent; }
  button { font:inherit; color:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--amber); outline-offset:3px; }
  .num { font-family:Seg7, ui-monospace, monospace; font-weight:normal; }

  /* status bar */
  .status { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; font-weight:600; font-size:15px; color:var(--dim); height:28px; }
  .signal { display:flex; align-items:center; gap:8px; }
  .bars { display:flex; align-items:flex-end; gap:2px; height:14px; }
  .bars i { width:4px; background:var(--line); border-radius:1px; }
  .bars i:nth-child(1) { height:25%; } .bars i:nth-child(2) { height:50%; } .bars i:nth-child(3) { height:75%; } .bars i:nth-child(4) { height:100%; }
  .bars[data-n="1"] i:nth-child(-n+1), .bars[data-n="2"] i:nth-child(-n+2),
  .bars[data-n="3"] i:nth-child(-n+3), .bars[data-n="4"] i:nth-child(-n+4) { background:var(--amber); }
  .bars[data-n="1"] i:nth-child(1) { background:var(--coral); }
  .signal.bad { color:var(--coral); }
  .heading { display:flex; align-items:center; gap:6px; color:var(--fg); }
  .heading svg { width:14px; height:14px; transition:transform .4s; }
  #clock { justify-self:end; }

  /* gauge */
  .gauge { position:relative; width:var(--g); height:var(--g); margin:8px auto 0; }
  .gauge svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .track { stroke:var(--surface); }
  #fill { stroke:url(#amberGrad); transition:stroke-dashoffset .5s ease-out; }
  .tick { stroke:var(--tick); stroke-width:1; }
  .tick.major { stroke:var(--tick-major); stroke-width:1.6; }
  .ticklabel { fill:var(--dim); font:600 8px Barlow, sans-serif; text-anchor:middle; dominant-baseline:central; }
  #maxMark { fill:var(--coral); transition:transform .5s ease-out; transform-origin:100px 100px; }
  .readout { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:4%; }
  .digits { display:flex; align-items:baseline; }
  .seg { position:relative; }
  .seg .ghost { position:absolute; inset:0; color:var(--ghost); }
  .seg .val { position:relative; }
  .big { font-size:calc(var(--g) * .2); }
  .small { font-size:calc(var(--g) * .09); margin-left:calc(var(--g) * .035); } /* DSEG's "." is zero-width and spills right */
  .unitlabel { color:var(--dim); font-weight:600; font-size:17px; margin-top:10px; }
  .elapsed { position:absolute; left:0; right:0; bottom:2%; text-align:center; }
  .elapsed b { display:block; font-size:calc(var(--g) * .075); }
  .elapsed span { color:var(--dim); font-size:14px; font-weight:500; }

  /* data fields */
  .fields { display:grid; grid-template-columns:1fr 1fr; margin-top:18px; border-top:1px solid var(--line); }
  .field { padding:12px 0 14px 16px; border-bottom:1px solid var(--line); min-width:0; }
  .field:nth-child(odd) { padding-left:4px; border-right:1px solid var(--line); }
  .field span { display:block; color:var(--dim); font-size:15px; font-weight:500; margin-bottom:6px; }
  .field b { font-size:28px; white-space:nowrap; }
  .field small { font-weight:600; font-size:15px; color:var(--dim); margin-left:5px; }

  /* controls */
  .controls { display:grid; grid-template-columns:52px 1fr 52px; align-items:center; gap:14px; margin-top:auto; padding-top:18px; }
  .icon { background:none; border:0; color:var(--dim); padding:10px; position:relative; border-radius:14px; }
  .icon svg { width:30px; height:30px; display:block; }
  .badge { position:absolute; top:2px; right:0; background:var(--amber); color:#1b1c1e; font-size:11px; font-weight:700;
           border-radius:9px; min-width:18px; padding:1px 5px; }
  .badge:empty { display:none; }
  .pill { display:flex; gap:10px; }
  .pill button { flex:1; height:76px; border:0; border-radius:38px; background:var(--coral); color:#fff; font-size:22px; font-weight:700;
                 transition:transform .1s; }
  .pill button:active { transform:scale(.97); }
  .pill #lapBtn { background:var(--surface); color:var(--fg); }
  .pill #startBtn.paused { background:var(--amber); color:#1b1c1e; }
  [hidden] { display:none !important; }

  /* sheets */
  dialog { background:var(--surface); color:var(--fg); border:0; border-radius:22px; width:min(92vw, 440px); max-height:80dvh; padding:20px 20px 16px; }
  dialog::backdrop { background:#000b; }
  dialog h2 { margin:0 0 14px; font-size:22px; font-weight:700; }
  dialog button, dialog select { font:600 17px Barlow, sans-serif; padding:12px 18px; border-radius:12px; border:0; background:var(--line); color:var(--fg); }
  dialog .danger { background:transparent; color:var(--coral); padding-left:0; margin-right:auto; }
  .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  label { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:17px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:17px; }
  th { text-align:left; color:var(--dim); font-weight:500; font-size:14px; padding:0 0 8px; }
  td { padding:10px 0; border-top:1px solid var(--line); }
  th:not(:first-child), td:not(:first-child) { text-align:right; }
  tr.best td { color:var(--amber); }
  dialog .primary { background:var(--coral); color:#fff; }
  dialog h2.section { margin-top:28px; padding-top:20px; border-top:1px solid var(--line); }
  td small { display:block; color:var(--dim); font-size:14px; }
  dialog .del { background:none; color:var(--dim); padding:10px 4px 10px 16px; font-size:24px; line-height:1; }
  #totals { margin-bottom:12px; }
  .empty { color:var(--dim); margin:4px 0 0; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
  <header class="status">
    <div class="signal" id="signal" role="status">
      <div class="bars" id="bars" data-n="0"><i></i><i></i><i></i><i></i></div>
      <span id="acc">Finding GPS</span>
    </div>
    <div class="heading" aria-label="Heading">
      <svg id="arrow" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1l5 12-5-3-5 3z" fill="var(--amber)"/></svg>
      <span id="compass">--</span>
    </div>
    <div id="clock">--:--</div>
  </header>

  <div class="gauge">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="amberGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" style="stop-color:var(--fill-a)"/><stop offset="1" style="stop-color:var(--fill-b)"/>
        </linearGradient>
      </defs>
      <!-- 270° arc, open at the bottom: from 135° clockwise to 45° -->
      <path class="track" d="M37.77 162.23A88 88 0 1 1 162.23 162.23" fill="none" stroke-width="7" stroke-linecap="round"/>
      <path id="fill" d="M37.77 162.23A88 88 0 1 1 162.23 162.23" fill="none" stroke-width="7" stroke-linecap="round"
            pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100"/>
      <g id="ticks"></g>
      <path id="maxMark" d="M100 4l-4-7h8z"/>
    </svg>
    <div class="readout">
      <div class="digits">
        <span class="seg num big"><span class="ghost">888.</span><span class="val" id="spInt">!!0.</span></span>
        <span class="seg num small"><span class="ghost">8</span><span class="val" id="spDec">0</span></span>
      </div>
      <div class="unitlabel u-speed">km/h</div>
    </div>
    <div class="elapsed"><b class="num" id="time">0:00:00</b><span>Ride time</span></div>
  </div>

  <section class="fields">
    <div class="field"><span>Distance</span><b><i class="num" id="dist" style="font-style:normal">0.00</i><small id="distUnit">km</small></b></div>
    <div class="field"><span>Avg speed</span><b><i class="num" id="avg" style="font-style:normal">0.0</i><small class="u-speed">km/h</small></b></div>
    <div class="field"><span>Max speed</span><b><i class="num" id="max" style="font-style:normal">0.0</i><small class="u-speed">km/h</small></b></div>
    <div class="field"><span id="lapLabel">Lap 1</span><b class="num" id="lapTime">0:00:00</b></div>
  </section>

  <nav class="controls">
    <button class="icon" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="pill">
      <button id="lapBtn" hidden>Lap</button>
      <button id="startBtn">Start</button>
    </div>
    <button class="icon" id="lapsBtn" aria-label="Laps and ride history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span class="badge" id="lapCount"></span>
    </button>
  </nav>

  <dialog id="settings">
    <h2>Settings</h2>
    <label>Units
      <select id="unitSel"><option value="kmh">Kilometres</option><option value="mph">Miles</option></select>
    </label>
    <label style="margin-top:14px">Display
      <select id="themeSel"><option value="auto">Auto</option><option value="night">Dark</option><option value="day">Daylight</option></select>
    </label>
    <div class="actions"><button onclick="settings.close()" autofocus>Done</button></div>
  </dialog>

  <dialog id="lapsDlg">
    <h2>This ride</h2>
    <div id="lapWrap"></div>
    <div class="actions" id="rideActions">
      <button class="danger" id="resetBtn">Discard</button>
      <button class="primary" id="finishBtn">Finish and save</button>
    </div>
    <h2 class="section">History</h2>
    <p class="empty" id="totals"></p>
    <div id="historyWrap"></div>
    <div class="actions"><button onclick="lapsDlg.close()" autofocus>Close</button></div>
  </dialog>

<script>
// ponytail: calibration knobs — tune on a real ride, phone GPS varies a lot
const MAX_ACCURACY_M = 25;  // ignore fixes less accurate than this
const MIN_SPEED_KMH = 2;    // below this = standing still (stops GPS jitter adding distance)
const MAX_SPEED_KMH = 100;  // faster than this on a bike = GPS glitch, drop the fix
const SMOOTHING = 0.5;      // 0..1, lower = smoother but slower to react

const UNITS = {
  kmh: { speed: 'km/h', perKmh: 1,        long: 'km', perM: 1 / 1000,     scale: 60 },
  mph: { speed: 'mph',  perKmh: 0.621371, long: 'mi', perM: 1 / 1609.344, scale: 40 },
};
const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];

const $ = id => document.getElementById(id);
let recording = false, last = null, wakeLock = null, smooth = 0;
let elapsedMs = 0, startedAt = 0, distM = 0, maxKmh = 0;
let laps = [], lapStart = { ms: 0, distM: 0 }, rideStart = 0;
// Ride data lives in this browser only. Home-screen apps keep it; a plain browser tab may lose it after weeks unused.
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let rides = store.get('rides', []);
let unit = 'kmh', theme = 'auto';
try { unit = localStorage.getItem('unit') === 'mph' ? 'mph' : 'kmh'; } catch {}
try { theme = localStorage.getItem('theme') || 'auto'; } catch {}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * r / 2) ** 2 +
            Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
console.assert(Math.abs(haversine(0, 0, 0, 1) - 111195) < 1, 'haversine broken');

const U = () => UNITS[unit];
const elapsed = () => elapsedMs + (recording ? Date.now() - startedAt : 0);
const kmh = (m, ms) => ms > 0 ? m / ms * 3600 : 0;
const spd = v => (v * U().perKmh).toFixed(1);
const dst = m => (m * U().perM).toFixed(2);
const fmtTime = ms => {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
};
// How far round the gauge (0..1) a speed in km/h sits
const gaugeFrac = v => Math.min(v * U().perKmh / U().scale, 1);

function drawTicks() {
  const { scale } = U(), out = [];
  for (let s = 0; s <= scale; s += 2) {
    const major = s % 10 === 0, a = (135 + 270 * s / scale) * Math.PI / 180;
    const x = r => (100 + r * Math.cos(a)).toFixed(2), y = r => (100 + r * Math.sin(a)).toFixed(2);
    const r0 = major ? 72 : 76;
    out.push(`<line class="tick${major ? ' major' : ''}" x1="${x(r0)}" y1="${y(r0)}" x2="${x(81)}" y2="${y(81)}"/>`);
    if (major) out.push(`<text class="ticklabel" x="${x(63)}" y="${y(63)}">${s}</text>`);
  }
  $('ticks').innerHTML = out.join('');
}

function showSpeed(v) {
  // DSEG: "!" is a blank the width of a digit, "." is zero-width — so the ghost "888." lines up
  const [i, d] = (v * U().perKmh).toFixed(1).split('.');
  $('spInt').textContent = i.slice(-3).padStart(3, '!') + '.';
  $('spDec').textContent = d;
  $('fill').style.strokeDashoffset = 100 - gaugeFrac(v) * 100;
}

function showSignal(accuracy) {
  const n = accuracy <= 5 ? 4 : accuracy <= 10 ? 3 : accuracy <= MAX_ACCURACY_M ? 2 : 1;
  $('bars').dataset.n = n;
  $('acc').textContent = `±${Math.round(accuracy)} m`;
  $('signal').classList.toggle('bad', n === 1);
}

function onFix(p) {
  const { latitude: lat, longitude: lon, accuracy, speed, heading } = p.coords;
  showSignal(accuracy);
  if (accuracy > MAX_ACCURACY_M) return;

  const fix = { lat, lon, t: p.timestamp };
  const d = last ? haversine(last.lat, last.lon, lat, lon) : 0;
  // Prefer the chip's Doppler speed; fall back to distance/time if the browser doesn't give one
  const v = speed != null ? speed * 3.6 : last ? kmh(d, fix.t - last.t) : 0;
  if (v > MAX_SPEED_KMH) return;

  smooth += SMOOTHING * (v - smooth);
  const moving = smooth >= MIN_SPEED_KMH;
  showSpeed(moving ? smooth : 0);
  if (moving && heading != null && !isNaN(heading)) {
    $('compass').textContent = COMPASS[Math.round(heading / 45) % 8];
    $('arrow').style.transform = `rotate(${heading}deg)`;
  }

  if (!recording || !last) { last = fix; return; }
  if (!moving) return; // keep `last`, so slow creep still counts once moving
  distM += d;
  maxKmh = Math.max(maxKmh, smooth);
  last = fix;
  render();
}

function onError(e) {
  $('bars').dataset.n = 0;
  $('signal').classList.add('bad');
  $('acc').textContent = e.code === 1 ? 'Allow location access' : 'No GPS signal';
}

function render() {
  const ms = elapsed();
  $('time').textContent = fmtTime(ms);
  $('dist').textContent = dst(distM);
  $('avg').textContent = spd(kmh(distM, ms));
  $('max').textContent = spd(maxKmh);
  $('lapTime').textContent = fmtTime(ms - lapStart.ms);
  $('maxMark').style.transform = `rotate(${-135 + 270 * gaugeFrac(maxKmh)}deg)`;
}

function renderLaps() {
  $('lapCount').textContent = laps.length || '';
  $('lapLabel').textContent = `Lap ${laps.length + 1}`;
  $('rideActions').hidden = elapsed() === 0;
  if (elapsed() === 0) { $('lapWrap').innerHTML = '<p class="empty">No ride in progress. Press Start to begin one.</p>'; return; }
  if (!laps.length) { $('lapWrap').innerHTML = '<p class="empty">Tap Lap while riding to split your ride into laps.</p>'; return; }
  const best = Math.max(...laps.map(l => kmh(l.lapM, l.lapMs)));
  $('lapWrap').innerHTML = `<table><tr><th>Lap</th><th>Time</th><th>${U().long}</th><th>${U().speed}</th></tr>` +
    laps.map(l => {
      const v = kmh(l.lapM, l.lapMs);
      return `<tr class="${laps.length > 1 && v === best ? 'best' : ''}"><td>${l.n}</td><td>${fmtTime(l.lapMs)}</td><td>${dst(l.lapM)}</td><td>${spd(v)}</td></tr>`;
    }).join('') + '</table>';
}

function renderHistory() {
  if (!rides.length) {
    $('totals').textContent = 'Finished rides are saved here.';
    $('historyWrap').innerHTML = '';
    return;
  }
  const totalM = rides.reduce((a, r) => a + r.distM, 0);
  $('totals').textContent = `${rides.length} ride${rides.length > 1 ? 's' : ''}, ${dst(totalM)} ${U().long} total`;
  $('historyWrap').innerHTML = `<table><tr><th>Date</th><th>Time</th><th>${U().long}</th><th>Avg</th><th></th></tr>` +
    rides.map((r, i) => {
      const d = new Date(r.start);
      return `<tr><td>${d.toLocaleDateString([], { day: 'numeric', month: 'short' })}<small>${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</small></td>` +
        `<td>${fmtTime(r.ms)}</td><td>${dst(r.distM)}</td><td>${spd(kmh(r.distM, r.ms))}<small>max ${spd(r.maxKmh)}</small></td>` +
        `<td><button class="del" data-i="${i}" aria-label="Delete ride">×</button></td></tr>`;
    }).join('') + '</table>';
}

// Saves the ride in progress so a closed tab or dead battery doesn't lose it
const saveCurrent = () => store.set('current', elapsed() > 0 ? { elapsedMs: elapsed(), distM, maxKmh, laps, lapStart, rideStart } : null);

function syncButtons() {
  const started = elapsed() > 0;
  $('startBtn').textContent = recording ? 'Pause' : started ? 'Resume' : 'Start';
  $('startBtn').classList.toggle('paused', !recording && started);
  $('lapBtn').hidden = !recording;
}

function applyUnits() {
  document.querySelectorAll('.u-speed').forEach(e => e.textContent = U().speed);
  $('distUnit').textContent = U().long;
  $('unitSel').value = unit;
  drawTicks(); showSpeed(smooth >= MIN_SPEED_KMH ? smooth : 0); render(); renderLaps(); renderHistory();
}

const lightOS = matchMedia('(prefers-color-scheme: light)');
function applyTheme() {
  const t = theme === 'auto' ? (lightOS.matches ? 'day' : 'night') : theme;
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'day' ? '#ffffff' : '#1b1c1e';
  $('themeSel').value = theme;
}
lightOS.addEventListener('change', applyTheme);

async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}

function start() {
  if (!elapsedMs) rideStart = Date.now();
  recording = true; startedAt = Date.now(); last = null;
  keepAwake(); syncButtons(); renderLaps();
}

function pause() {
  elapsedMs = elapsed(); recording = false;
  wakeLock?.release(); wakeLock = null;
  syncButtons(); render(); saveCurrent();
}

function lap() {
  const ms = elapsed();
  laps.unshift({ n: laps.length + 1, lapMs: ms - lapStart.ms, lapM: distM - lapStart.distM });
  lapStart = { ms, distM };
  renderLaps(); render(); saveCurrent();
  navigator.vibrate?.(60);
}

function reset() {
  if (recording) pause();
  elapsedMs = 0; distM = 0; maxKmh = 0; laps = []; lapStart = { ms: 0, distM: 0 }; rideStart = 0;
  syncButtons(); render(); renderLaps(); saveCurrent();
}

function finish() {
  if (recording) pause();
  rides.unshift({ start: rideStart, ms: elapsedMs, distM, maxKmh, laps });
  store.set('rides', rides);
  reset(); renderHistory();
}

$('startBtn').onclick = () => recording ? pause() : start();
$('lapBtn').onclick = lap;
$('resetBtn').onclick = () => confirm('Discard this ride? It will not be saved to history.') && reset();
$('finishBtn').onclick = finish;
$('historyWrap').onclick = e => {
  const i = e.target.dataset?.i;
  if (i == null || !confirm('Delete this ride from history?')) return;
  rides.splice(+i, 1); store.set('rides', rides); renderHistory();
};
$('settingsBtn').onclick = () => settings.showModal();
$('lapsBtn').onclick = () => lapsDlg.showModal();
$('unitSel').onchange = e => { unit = e.target.value; try { localStorage.setItem('unit', unit); } catch {} applyUnits(); };

const tickClock = () => $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
setInterval(() => { tickClock(); if (recording) { render(); saveCurrent(); } }, 1000);
$('themeSel').onchange = e => { theme = e.target.value; try { localStorage.setItem('theme', theme); } catch {} applyTheme(); };
// Bring back a ride that was interrupted (tab closed, phone died) — paused, so time doesn't jump
const interrupted = store.get('current', null);
if (interrupted) ({ elapsedMs, distM, maxKmh, laps, lapStart, rideStart } = interrupted);
tickClock(); applyTheme(); applyUnits(); syncButtons();

// GPS runs while the app is open so the signal can settle before you press Start
if (navigator.geolocation) navigator.geolocation.watchPosition(onFix, onError, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
else onError({ code: 0 });
// Wake lock is dropped when the tab is hidden; take it back on return
document.addEventListener('visibilitychange', () => recording && document.visibilityState === 'visible' && keepAwake());
</script>
</body>
</html>
